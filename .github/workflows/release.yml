name: Release

on:
  release:
    types: [ published ]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 11
      
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Set version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Extract tag name from ref
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # Remove leading 'v' if present
          VERSION=${TAG_NAME#v}
          # Validate version format (d.d.d)
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version '$VERSION' (from tag '$TAG_NAME') does not match format d.d.d"
            exit 1
          fi
          echo "Setting version to $VERSION"
          pnpm version $VERSION --no-git-tag-version

      - name: Set release date
        env:
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          # published_at è in formato ISO 8601 (es. 2026-09-14T20:46:38Z): tiene solo YYYY-MM-DD
          echo "VITE_DATA_RELEASE=${PUBLISHED_AT%%T*}" >> "$GITHUB_ENV"

      - name: Build and Package
        run: |
          pnpm build:electron
        env:
          VITE_APP: desktop
          VITE_RELEASE: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
